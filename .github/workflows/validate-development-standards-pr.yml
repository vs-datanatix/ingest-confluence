name: Validate Development Standards PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base reference to compare against (e.g., origin/main)"
        required: false
        default: "origin/main"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-standards:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Development Standards Validation
    env:
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.base_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch base branch
        run: |
          BRANCH_NAME="${BASE_REF#origin/}"
          git fetch origin "$BRANCH_NAME" --depth=1

      - name: Run validator from repository source of truth
        id: validate
        run: |
          set +e
          python scripts/validate_development_standards.py \
            --base-ref "$BASE_REF" \
            --report-path development-standards-validation.md \
            --json-path development-standards-validation.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show validation report in logs
        if: always()
        run: |
          if [ -f development-standards-validation.md ]; then
            echo "--- development-standards-validation.md ---"
            cat development-standards-validation.md
          else
            echo "Validation report not found"
          fi

      - name: Publish validation comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- development-standards-validation -->";
            const reportPath = "development-standards-validation.md";
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, "utf8")
              : "Validation report was not generated.";

            const exitCode = "${{ steps.validate.outputs.exit_code }}";
            const header = exitCode === "0"
              ? "## Development standards validation passed"
              : "## Development standards validation failed";

            const body = `${marker}\n${header}\n\n${report}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.data.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-standards-validation
          path: |
            development-standards-validation.md
            development-standards-validation.json
          if-no-files-found: warn

      - name: Block merge on violations
        if: steps.validate.outputs.exit_code != '0'
        run: |
          echo "Development standards violations found."
          exit 1
